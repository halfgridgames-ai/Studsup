<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studs Up">
<meta name="theme-color" content="#08130c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
<title>Studs Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed pitch canvas, broadcast scorebug top-left, fury gauge bottom-left, touch pad overlay on phones. Single dark arcade look on purpose. */
:root{
  --night:#08130c;      /* stadium dark */
  --chalk:#f3efe2;      /* line paint / text */
  --home:#e8322b;       /* home kit */
  --away:#38b6ff;       /* away kit */
  --flare:#ffc23a;      /* fury, highlights */
  --panel:rgba(6,12,8,.84);
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#gl,#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:stretch;font-family:var(--display);font-size:15px;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hud span{display:flex;align-items:center;padding:4px 10px}
.hud .tm{font-size:12px}
.hud .h{background:var(--home)} .hud .a{background:var(--away);color:var(--night)}
.hud .sc{background:var(--chalk);color:var(--night);min-width:62px;justify-content:center;font-variant-numeric:tabular-nums}
.hud .clk{background:var(--panel);font-variant-numeric:tabular-nums;min-width:48px;justify-content:center;color:var(--flare)}
.fury{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(220px,40vw);font-family:var(--display);font-size:11px;letter-spacing:.12em}
.fury .bar{height:12px;background:var(--panel);border:2px solid var(--chalk);margin-top:3px;overflow:hidden}
.fury i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--flare) 0 8px,#ff7a1a 8px 16px)}
.fury.full i{animation:pulse .4s infinite alternate}
.fury.full label{color:var(--flare)}
@keyframes pulse{to{filter:brightness(1.6)}}
.banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(34px,9vw,84px);line-height:1;color:var(--chalk);text-shadow:4px 4px 0 var(--night),-2px -2px 0 var(--night);transform:skewX(-8deg)}
.banner small{display:block;font-family:var(--body);font-weight:700;font-size:clamp(16px,3vw,24px);letter-spacing:.2em;margin-top:8px;text-shadow:2px 2px 0 var(--night)}
.banner .card{display:inline-block;width:.55em;height:.75em;border-radius:4px;vertical-align:-.05em;margin-right:.25em;box-shadow:3px 3px 0 var(--night)}
.banner .yc{background:var(--flare)} .banner .rc{background:#e8322b}
.btn-ui{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px}
.btn-ui button{font-family:var(--display);font-size:11px;background:var(--panel);color:var(--chalk);border:2px solid var(--chalk);padding:6px 9px;cursor:pointer}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:rgba(4,9,6,.78);padding:16px;overflow:auto}
.overlay>*{margin-block:auto}
.sheet{max-width:620px;width:100%;display:grid;gap:18px}
.sheet h1{font-family:var(--display);font-size:clamp(46px,13vw,108px);line-height:.9;margin:0;transform:skewX(-8deg);color:var(--chalk);text-shadow:6px 6px 0 var(--home)}
.sheet h1 em{font-style:normal;color:var(--flare)}
.sheet p{margin:0;font-size:19px;line-height:1.35;max-width:54ch;color:#cfd6c8}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 18px;font-size:17px}
.ctl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(243,239,226,.18);padding:4px 0}
.ctl b{font-weight:700;color:var(--flare);letter-spacing:.06em}
.sheet .go{justify-self:start;font-family:var(--display);font-size:24px;background:var(--home);color:var(--chalk);border:0;padding:12px 26px;cursor:pointer;box-shadow:5px 5px 0 var(--chalk);transform:skewX(-8deg)}
.sheet .go:focus-visible,.btn-ui button:focus-visible{outline:3px solid var(--flare);outline-offset:3px}
.pick{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px}
.prow>span{font-family:var(--display);font-size:13px;width:34px;color:var(--flare)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:11px;letter-spacing:.03em;color:#fff;background:var(--c);border:3px solid transparent;
  padding:5px 9px 5px 6px;cursor:pointer;opacity:.55;transform:skewX(-8deg);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.chips button i{font-style:normal;font-size:18px;line-height:1;transform:skewX(8deg)}
.chips button[aria-pressed="true"]{opacity:1;border-color:var(--chalk);box-shadow:4px 4px 0 var(--chalk)}
.chips button:disabled{opacity:.18;cursor:default}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.coins{font-family:var(--display);font-size:15px;background:var(--panel);color:#ffd84a;border:2px solid #ffd84a;padding:4px 10px;letter-spacing:.03em;white-space:nowrap}
.shopbtn{font-family:var(--display);font-size:15px;background:#ffd84a;color:var(--night);border:0;padding:7px 16px;cursor:pointer;transform:skewX(-8deg);box-shadow:4px 4px 0 var(--chalk)}
.earn{display:grid;gap:3px;font-size:17px;max-width:360px}
.earn div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(243,239,226,.15);padding:2px 0}
.earn b{color:#ffd84a}.earn .tot{font-family:var(--display);font-size:20px;border:0}
.adbtn{font-family:var(--display);font-size:14px;background:#1f9a52;color:#fff;border:0;padding:9px 14px;cursor:pointer;transform:skewX(-8deg);box-shadow:4px 4px 0 var(--chalk)}
.adbtn:disabled{opacity:.5;cursor:default}
.shopov{z-index:5}
.shopbox{width:min(760px,100%);max-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;background:#0b1510;border:3px solid var(--chalk);padding:12px;box-shadow:8px 8px 0 #ffd84a;min-height:0}
.shophead{display:flex;align-items:center;gap:10px}
.shophead h2{font-family:var(--display);font-size:28px;margin:0;transform:skewX(-8deg);color:#ffd84a;flex:1}
.shophead button{font-family:var(--display);font-size:12px;background:var(--panel);color:var(--chalk);border:2px solid var(--chalk);padding:6px 10px;cursor:pointer}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.tabs button{font-family:var(--display);font-size:11px;background:transparent;color:var(--chalk);border:2px solid rgba(243,239,226,.35);padding:6px 9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;overflow:auto;min-height:0;align-content:start}
.item{display:grid;gap:4px;justify-items:center;text-align:center;background:#15201a;border:2px solid rgba(243,239,226,.18);padding:10px 6px;cursor:pointer;color:var(--chalk);font-family:var(--body)}
.item .ic{font-size:30px;line-height:1.1;height:38px;display:grid;place-items:center}
.item .sw{width:38px;height:30px;border-radius:4px;border:2px solid #fff;box-shadow:inset 0 -10px 0 var(--sh)}
.item .nm{font-family:var(--display);font-size:11px;letter-spacing:.03em}
.item .pr{font-weight:700;font-size:15px;color:#ffd84a}
.item.owned .pr{color:#9fd8a8}.item.eq{border-color:#ffd84a;box-shadow:0 0 0 2px #ffd84a inset}.item.eq .pr{color:#ffd84a}
.item.poor .pr{color:#c98a8a}
.shopmsg{min-height:20px;font-weight:700;font-size:16px;color:#ffd84a;text-align:center}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:#ffd84a;color:var(--night);font-family:var(--display);font-size:15px;padding:10px 16px;box-shadow:5px 5px 0 var(--night);text-align:center;pointer-events:none;max-width:92vw}
.toast small{display:block;font-family:var(--body);font-weight:700;font-size:13px;margin-top:3px}
.final{font-family:var(--display);font-size:clamp(40px,10vw,72px)}
.stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0}
.touch{position:fixed;inset:0;pointer-events:none}
.touch .zone{position:absolute;left:0;top:0;bottom:0;width:50%;pointer-events:auto}
.touch .knob,.touch .base{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.touch .base{width:124px;height:124px;border:3px solid rgba(243,239,226,.45);background:rgba(6,12,8,.25)}
.touch .knob{width:56px;height:56px;background:rgba(243,239,226,.55);box-shadow:0 0 0 3px rgba(6,12,8,.4)}
.touch .base.idle{opacity:.55}
.pad{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:224px;height:150px;pointer-events:none}
.pad .act{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border:0;border-radius:50%;color:#fff;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 46%),var(--bc,#333);opacity:.9;
  box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.85),inset 0 -8px 14px rgba(0,0,0,.28);
  font-family:var(--display);letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.5);touch-action:none;pointer-events:auto;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  transition:transform .07s ease-out,box-shadow .07s,filter .15s}
.pad .act svg{width:40%;height:auto;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45));pointer-events:none}
.pad .act .lb{font-size:10px;line-height:1;pointer-events:none;white-space:nowrap}
.pad .act .ring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--rc,#fff) calc(var(--p,0)*1turn),rgba(255,255,255,0) 0);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 65%);mask:radial-gradient(circle,transparent 64%,#000 65%)}
.pad .act.on{transform:translateY(4px) scale(.93);box-shadow:0 1px 0 rgba(0,0,0,.5),inset 0 0 0 3px #fff,inset 0 -4px 10px rgba(0,0,0,.28);filter:brightness(1.3)}
.pad .act.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.78)}60%{transform:scale(1.09)}100%{transform:scale(1)}}
.pad .shoot{width:112px;height:112px;right:0;bottom:0}
.pad .shoot .lb{font-size:13px}
.pad .pass{width:90px;height:90px;right:122px;bottom:34px}
.pad.atk .shoot{--bc:#e8322b;--rc:#ffc23a}.pad.atk .pass{--bc:#2f6df0}
.pad.def .shoot{--bc:#e0a019;--rc:#fff}.pad.def .pass{--bc:#3a4a63}
.pad.def .shoot.jump{--bc:#d9361f}.pad.def .shoot.dive{--bc:#8a3ff0}.pad.def .shoot.barge{--bc:#c2410c}
.pad .shoot.cool{filter:saturate(.35) brightness(.75)}
.pad .dance{width:62px;height:62px;right:150px;bottom:136px;--bc:#d63cc0;--rc:#ffc23a}
.pad .dance .lb{font-size:8.5px}.pad .dance.full{filter:saturate(.3) brightness(.65)}
.pad .dance.going{animation:boogie .4s infinite alternate}
@keyframes boogie{from{transform:rotate(-8deg) scale(1.04)}to{transform:rotate(8deg) scale(1.04)}}
.pad .skill{width:70px;height:70px;right:6px;bottom:124px;--bc:#12a39a;--rc:#fff}
.pad .skill .lb{font-size:9px}
.pad.def .skill{filter:saturate(.2) brightness(.55)}
.pad .skill.cool{filter:saturate(.35) brightness(.75)}
.pad .skill.hot{--bc:#ff3d7f;animation:pulse .25s infinite alternate}
.comm{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%) skewX(-8deg);max-width:min(560px,80vw);background:var(--panel);border-left:5px solid var(--flare);
  padding:6px 14px;font-family:var(--display);font-size:clamp(12px,2.2vw,17px);line-height:1.15;letter-spacing:.02em;text-align:center;pointer-events:none;transition:opacity .35s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.comm.hide{opacity:0}
.comm::before{content:'🎙 '}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{font-family:var(--display);font-size:11px;background:var(--panel);color:var(--chalk);border:2px solid rgba(243,239,226,.5);padding:6px 9px;cursor:pointer}
.tour{display:grid;gap:8px}
.reg{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#15201a;border:2px solid rgba(243,239,226,.2);padding:8px 10px}
.reg.lock{opacity:.45}.reg.done{border-color:#9fd8a8}.reg.cur{border-color:var(--flare);box-shadow:4px 4px 0 var(--flare)}
.reg .ri{font-size:30px;line-height:1}.reg h3{margin:0 0 2px;font-family:var(--display);font-size:15px;letter-spacing:.03em}
.reg .ladder{font-size:18px}.reg .pz{font-size:14px;font-weight:700;color:#ffd84a}
.reg button{font-family:var(--display);font-size:13px;line-height:1.1;background:#e8322b;color:#fff;border:0;padding:8px 12px;cursor:pointer;transform:skewX(-8deg);box-shadow:3px 3px 0 var(--chalk)}
.touch-only{display:none}
@media (pointer:coarse){
  .touch-only{display:block}.ctl.touch-only{display:grid}.kb-only{display:none}
  .fury{bottom:auto;top:calc(46px + env(safe-area-inset-top,0px));width:160px}
  .sheet{gap:12px}.sheet h1{font-size:44px}.sheet p{display:none}.ctl{font-size:15px;grid-template-columns:1fr 1fr}.sheet .go{font-size:20px;padding:10px 22px}
  .banner{top:24%}
  .final{font-size:24px}.earn{font-size:15px}
  .comm{top:auto;bottom:calc(100px + env(safe-area-inset-bottom,0px));max-width:40vw;font-size:12px}
}
@media (pointer:coarse) and (orientation:portrait){
  .btn-ui{top:calc(44px + env(safe-area-inset-top,0px));flex-direction:column;align-items:flex-end;gap:5px}
  .btn-ui button{font-size:10px;padding:5px 8px}
  .hud{font-size:13px}.hud .tm{font-size:10px}.hud span{padding:4px 7px}
  .pad{transform:scale(.88);transform-origin:100% 100%}
  .banner{top:30%}
  .comm{left:12px;bottom:auto;transform:skewX(-8deg);top:calc(176px + env(safe-area-inset-top,0px));max-width:calc(100vw - 110px);text-align:left}
}
/* Menus: one home screen with three modes, sub screens with a back arrow. In a menu the match HUD is hidden. */
.menu-on #game,.menu-on .hud,.menu-on .fury,.menu-on .btn-ui,.menu-on #touch,.menu-on .comm,.menu-on .banner{display:none!important}
.btn-ui #camBtn,.btn-ui #fsBtn,.btn-ui #musicBtn,.btn-ui #muteBtn{display:none}
.btn-ui #pauseBtn{width:42px;height:42px;padding:0;border-radius:50%;font-size:15px;display:grid;place-items:center}
.sheet.menu{max-width:560px;gap:14px}
.hrow{display:flex;align-items:center;gap:10px}
.iconbtn{font-size:20px;width:40px;height:40px;background:var(--panel);color:var(--chalk);border:2px solid var(--chalk);cursor:pointer;display:grid;place-items:center;padding:0}
.logo{font-family:var(--display);font-size:clamp(54px,15vw,104px);line-height:.88;margin:6px 0 4px;transform:skewX(-8deg);color:var(--chalk);text-shadow:6px 6px 0 var(--home);text-align:center}
.logo em{font-style:normal;color:var(--flare)}
.logo.logoimg{transform:none;text-shadow:none;margin:0 auto;line-height:0}.logo.logoimg img{display:block;width:min(74vw,400px);max-height:34vh;object-fit:contain;margin:0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}@media (max-height:500px){.logo.logoimg img{max-height:25vh}}
.logo small{display:block;font-size:.17em;letter-spacing:.32em;color:var(--chalk);text-shadow:none;margin-top:10px;opacity:.85}
.modes{display:grid;gap:12px}
.mode{font-family:var(--body);display:grid;grid-template-columns:52px 1fr 22px;align-items:center;gap:12px;text-align:left;background:var(--mc);border:0;padding:14px 16px;color:#fff;cursor:pointer;
  transform:skewX(-6deg);box-shadow:5px 5px 0 var(--chalk);transition:transform .08s}
.mode:active{transform:skewX(-6deg) translate(3px,3px);box-shadow:2px 2px 0 var(--chalk)}
.mode:focus-visible,.tcard:focus-visible,.slot:focus-visible,.seg button:focus-visible,.back:focus-visible{outline:3px solid var(--flare);outline-offset:3px}
.mode .mi{font-size:34px;line-height:1;transform:skewX(6deg);text-align:center}
.mode b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.02em;font-weight:400}
.mode span{display:block;font-weight:700;font-size:16px;opacity:.88;margin-top:2px}
.mode .ar{display:grid;place-items:center;opacity:.85}
.mode.single{--mc:#d92a24}.mode.career{--mc:#1b8c4a}.mode.online{--mc:#2a5fd6}
.link{justify-self:center;background:none;border:0;color:var(--chalk);font-family:var(--display);font-size:13px;letter-spacing:.08em;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.subhead{display:flex;align-items:center;gap:12px}
.subhead h2{flex:1;margin:0;font-family:var(--display);font-size:clamp(22px,6vw,32px);transform:skewX(-8deg);color:var(--chalk);text-shadow:3px 3px 0 var(--home);font-weight:400}
.back{width:42px;height:42px;flex:none;background:var(--chalk);color:var(--night);border:0;cursor:pointer;display:grid;place-items:center;padding:0}
.sheet .go.stick{position:sticky;bottom:6px;z-index:2}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs>span{font-family:var(--display);font-size:20px;color:var(--flare)}
.slot{display:grid;justify-items:center;gap:2px;background:var(--c);color:#fff;border:3px solid transparent;padding:8px 6px;cursor:pointer;opacity:.7;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.slot small{font-family:var(--display);font-size:10px;letter-spacing:.1em}.slot i{font-style:normal;font-size:34px;line-height:1.1}.slot b{font-family:var(--display);font-size:13px;font-weight:400}
.slot.on{opacity:1;border-color:var(--chalk);box-shadow:4px 4px 0 var(--chalk)}
.hint{font-weight:700;font-size:15px;color:#cfd6c8;margin:-4px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.tcard{display:grid;justify-items:center;gap:1px;background:var(--c);color:#fff;border:3px solid transparent;padding:7px 3px;cursor:pointer;opacity:.62;font-family:var(--display);font-size:10px;letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.tcard i{font-style:normal;font-size:26px;line-height:1.15}.tcard em{font-style:normal;font-family:var(--body);font-weight:700;font-size:12px}
.tcard[aria-pressed="true"]{opacity:1;border-color:var(--chalk);box-shadow:3px 3px 0 var(--chalk)}
.tcard:disabled{opacity:.15;cursor:default}
.setlist{display:grid}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid rgba(243,239,226,.16);padding:8px 0;font-family:var(--display);font-size:13px;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end}
.seg button{font-family:var(--display);font-size:11px;background:transparent;color:var(--chalk);border:2px solid rgba(243,239,226,.4);margin-left:-2px;padding:6px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk);position:relative}
.brow{display:flex;gap:10px;flex-wrap:wrap}
.ghost{font-family:var(--display);font-size:13px;background:var(--panel);color:var(--chalk);border:2px solid var(--chalk);padding:9px 14px;cursor:pointer}
.ptitle{font-family:var(--display);font-size:40px;margin:0;transform:skewX(-8deg);font-weight:400}
.sheet .intro{display:block;font-size:18px}
.netbox{display:grid;gap:10px;background:#15201a;border:2px solid rgba(243,239,226,.2);padding:12px}

/* ---------- v27 look: glass panels, neon edges, angled cuts over a live fly-round of the home ground ---------- */
:root{--night:#05070d;--chalk:#eef6ff;--flare:#ffd24a;--panel:rgba(8,14,28,.74);--neon:#3cf0ff;--neon2:#a46bff;--glass:rgba(9,16,32,.62);--line:rgba(140,220,255,.22);
  --display:'Orbitron','Bungee',Impact,sans-serif;--body:'Rajdhani','Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);--cuts:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
body{font-weight:600}
.overlay{background:radial-gradient(130% 90% at 50% 35%,rgba(4,8,22,.25),rgba(3,5,12,.86) 75%),linear-gradient(rgba(60,240,255,.035) 1px,transparent 1px) 0 0/100% 3px}
.overlay::after{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(60,240,255,.12),transparent 18%,transparent 82%,rgba(164,107,255,.12))}
.sheet.menu{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);max-width:600px}
.sheet h1,.ptitle,.subhead h2,.shophead h2,.banner,.sheet .go,.mode,.slot,.tcard,.shopbtn,.adbtn,.reg button,.clipbtn,.comm,.chips button{transform:none}
.mode .mi,.chips button i{transform:none}
.subhead h2{font-weight:800;letter-spacing:.08em;font-size:clamp(18px,5vw,26px);text-shadow:0 0 18px rgba(60,240,255,.45);color:var(--chalk)}
.subhead h2::after{content:'';display:block;height:2px;margin-top:6px;width:64px;background:linear-gradient(90deg,var(--neon),transparent)}
.back{background:rgba(60,240,255,.1);color:var(--neon);border:1px solid rgba(60,240,255,.5);clip-path:var(--cuts)}
.back:hover{background:rgba(60,240,255,.22)}
.sheet .go{font-weight:900;letter-spacing:.12em;font-size:20px;color:#04121a;background:linear-gradient(90deg,#28e8ff,#7d6bff);padding:14px 30px;clip-path:var(--cut);box-shadow:none;
  filter:drop-shadow(0 0 14px rgba(60,240,255,.45));transition:filter .15s,transform .08s}
.sheet .go:hover{filter:drop-shadow(0 0 22px rgba(60,240,255,.75)) brightness(1.08)}.sheet .go:active{transform:scale(.97)}
.sheet .go.stick{justify-self:stretch;text-align:center}
.mode{font-family:var(--body);background:linear-gradient(100deg,var(--mc) 0%,rgba(10,18,36,.82) 62%);border:1px solid rgba(255,255,255,.12);clip-path:var(--cut);box-shadow:none;padding:15px 16px;
  transition:filter .15s,transform .08s;position:relative}
.mode::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--mc),transparent)}
.mode:hover{filter:brightness(1.15) drop-shadow(0 0 10px var(--mc))}.mode:active{transform:scale(.985);box-shadow:none}
.mode b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.08em}
.mode span{font-weight:600}
.mode.single{--mc:#ff3d63}.mode.career{--mc:#17d68a}.mode.online{--mc:#3c86ff}
.mode .mi{font-size:30px;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.link{font-weight:700;letter-spacing:.14em;color:var(--neon);text-decoration:none;border-bottom:1px solid rgba(60,240,255,.4);padding:4px 2px;font-size:12px}
.coins{background:rgba(255,210,74,.08);border:1px solid rgba(255,210,74,.6);clip-path:var(--cuts);font-weight:800;font-size:13px}
.shopbtn{background:linear-gradient(90deg,#ffd24a,#ff9a3c);color:#1a1004;box-shadow:none;clip-path:var(--cuts);font-weight:900;letter-spacing:.1em;font-size:13px}
.iconbtn{background:rgba(60,240,255,.08);border:1px solid rgba(60,240,255,.45);color:var(--neon);clip-path:var(--cuts)}
.ghost{background:rgba(60,240,255,.06);border:1px solid rgba(60,240,255,.45);color:var(--chalk);clip-path:var(--cuts);font-weight:800;letter-spacing:.08em}
.setrow{font-weight:700;font-size:12px;letter-spacing:.1em;border-bottom:1px solid var(--line)}
.seg{gap:4px}.seg button{margin:0;border:1px solid rgba(140,220,255,.3);border-radius:999px;font-weight:700;padding:6px 11px;font-size:10.5px}
.seg button[aria-pressed="true"]{background:var(--neon);border-color:var(--neon);color:#04121a;box-shadow:0 0 12px rgba(60,240,255,.5)}
.hint,.sheet p,.sheet .intro{color:#b8c8dc}
.reg,.netbox,.item{background:rgba(12,20,40,.6);border:1px solid var(--line);border-radius:12px}
.reg.cur{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 18px rgba(60,240,255,.25)}
.reg button{clip-path:var(--cuts);box-shadow:none;background:linear-gradient(90deg,#ff3d63,#ff7a3c)}
.shopbox{background:rgba(8,14,28,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.shophead h2{color:var(--flare);font-weight:900;letter-spacing:.08em;text-shadow:0 0 16px rgba(255,210,74,.4)}
.shophead button,.tabs button{border:1px solid var(--line);border-radius:999px}
.tabs button[aria-selected="true"]{background:var(--neon);border-color:var(--neon);color:#04121a}
.item.eq{border-color:var(--flare);box-shadow:0 0 0 1px var(--flare) inset,0 0 14px rgba(255,210,74,.25)}
.code{background:rgba(5,8,16,.8);border:1px solid var(--neon);border-radius:10px}
.bigcode,.status{color:var(--neon)}
.toast{background:linear-gradient(90deg,#28e8ff,#7d6bff);color:#04121a;box-shadow:0 0 24px rgba(60,240,255,.45);clip-path:var(--cut)}
/* match HUD */
.hud{box-shadow:none;clip-path:var(--cuts);font-weight:800;font-size:13px}
.hud .sc{background:rgba(8,14,28,.82);color:var(--chalk)}.hud .clk{background:rgba(8,14,28,.82);color:var(--neon)}
.comm{background:rgba(8,14,28,.78);border-left:3px solid var(--neon);border-radius:0 10px 10px 0;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(60,240,255,.15)}
.banner{font-weight:900;letter-spacing:.04em;text-shadow:0 0 22px rgba(60,240,255,.65),0 3px 0 #000}
.banner small{letter-spacing:.3em;text-shadow:0 2px 0 #000}
.btn-ui button{background:rgba(8,14,28,.7);border:1px solid rgba(60,240,255,.5);color:var(--neon)}
.fury{font-weight:800}.fury .bar{border:1px solid rgba(60,240,255,.6);border-radius:999px;background:rgba(8,14,28,.75)}
.fury i{background:linear-gradient(90deg,#28e8ff,#a46bff,#ff3d63)}
.clipbtn{clip-path:var(--cuts);box-shadow:none}
.final{font-weight:900;text-shadow:0 0 22px rgba(255,210,74,.5)}
/* team select: swipe through the teams; the home ground behind changes with them */
.ttabs{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.ttab{display:grid;gap:2px;text-align:left;padding:8px 12px;background:rgba(10,18,36,.6);border:1px solid var(--line);color:var(--chalk);cursor:pointer;clip-path:var(--cuts);position:relative;opacity:.65;font-family:var(--body)}
.ttab::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ttab small{font-family:var(--display);font-size:9px;letter-spacing:.18em;color:#9fb4cc}.ttab b{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.04em}
.ttab.on{opacity:1;border-color:var(--neon);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 30%,transparent),rgba(10,18,36,.7))}
.vsmini{align-self:center;font-family:var(--display);font-weight:900;font-size:16px;color:var(--flare);text-shadow:0 0 12px rgba(255,210,74,.6)}
.car{position:relative;margin:0 -6px}
.car-track{--cw:62%;position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x}
.car-track::-webkit-scrollbar{display:none}
.car-track::before,.car-track::after{content:'';flex:0 0 calc((100% - var(--cw)) / 2 - 14px)}
.tc{flex:0 0 var(--cw);scroll-snap-align:center;position:relative;container-type:inline-size;aspect-ratio:4/3.3;border-radius:16px;overflow:hidden;cursor:pointer;
  background:radial-gradient(90% 70% at 50% 35%,color-mix(in srgb,var(--c) 70%,#fff 0%) 0%,var(--d) 62%,#05070d 100%);border:1px solid rgba(255,255,255,.14);
  transform:scale(.86);opacity:.55;transition:transform .25s,opacity .25s,box-shadow .25s,border-color .25s}
.tc::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px)}
.tc.sel{transform:scale(1);opacity:1;border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px color-mix(in srgb,var(--c) 55%,transparent)}
.tc-art{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);height:78%;max-width:96%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.tc-emo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-style:normal;font-size:84px}
.tc-info{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(0deg,rgba(3,5,12,.92),rgba(3,5,12,.0));display:grid;gap:1px}
.tc-info b{font-family:var(--display);font-weight:900;font-size:clamp(11px,10cqw,24px);white-space:nowrap;letter-spacing:.06em;text-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent)}
.tc-info span{font-size:clamp(9px,6.5cqw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.12em;color:#b8c8dc}.tc-info span::before{content:'⌖ ';color:var(--neon)}
.tc-lock{position:absolute;right:10px;top:-26px;font-style:normal;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.08em;background:rgba(3,5,12,.85);border:1px solid var(--flare);color:var(--flare);padding:4px 8px;border-radius:999px}
.tc.lock .tc-art{filter:grayscale(.85) brightness(.55) drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.tc.taken{opacity:.25}
.car-nav{position:absolute;top:42%;z-index:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(8,14,28,.8);border:1px solid rgba(60,240,255,.5);color:var(--neon);cursor:pointer;padding:0}
.car-nav.prev{left:2px}.car-nav.next{right:2px}.car-nav svg{width:20px;height:20px}
.car-dots{display:flex;justify-content:center;gap:6px;margin-top:-4px}.car-dots i{width:6px;height:6px;border-radius:999px;background:rgba(160,200,230,.3);transition:width .2s,background .2s}
.car-dots i.on{width:20px;background:var(--neon);box-shadow:0 0 8px var(--neon)}
@media (orientation:portrait){.car-track{--cw:74%}.tc{aspect-ratio:4/4.5}}
@media (orientation:landscape) and (max-height:560px){.car-track{--cw:31%}.tc{aspect-ratio:1/1}.tc-art{height:76%;bottom:20%}.sheet.menu{padding:12px 16px}}
/* VS screen */
.vsx{position:fixed;inset:0;z-index:7;overflow:hidden;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto 1fr auto;align-items:center;font-family:var(--body);color:var(--chalk);
  background:radial-gradient(120% 90% at 50% 50%,rgba(3,5,12,.0),rgba(3,5,12,.7) 80%)}
.vsx::before,.vsx::after{content:'';position:absolute;top:0;bottom:0;width:58%;opacity:.55;mix-blend-mode:screen}
.vsx::before{left:-8%;background:linear-gradient(90deg,var(--c0),transparent);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);animation:vsxL .5s cubic-bezier(.2,.9,.2,1) both}
.vsx::after{right:-8%;background:linear-gradient(270deg,var(--c1),transparent);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);animation:vsxR .5s cubic-bezier(.2,.9,.2,1) both}
.vsx-top{grid-column:1/4;justify-self:center;z-index:1;margin-top:calc(14px + env(safe-area-inset-top,0px));font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.4em;color:var(--neon);
  padding:6px 16px;border:1px solid rgba(60,240,255,.45);background:rgba(5,8,16,.6);clip-path:var(--cuts)}
.vsx-side{position:relative;z-index:1;display:grid;justify-items:center;align-self:stretch;align-content:center;gap:6px;min-width:0}
.vsx-side img{height:min(48vh,52vw);max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.vsx-side i{font-style:normal;font-size:min(26vh,26vw)}
.vsx-side.l{animation:vsxL .55s .05s cubic-bezier(.2,.9,.2,1) both}.vsx-side.r{animation:vsxR .55s .05s cubic-bezier(.2,.9,.2,1) both}
.vsx-name{text-align:center;display:grid;gap:2px}
.vsx-name small{font-family:var(--display);font-size:10px;letter-spacing:.3em;color:#b8c8dc}
.vsx-name b{font-family:var(--display);font-weight:900;font-size:clamp(18px,4vw,36px);letter-spacing:.06em;text-shadow:0 0 18px var(--tc),0 3px 0 #000}
.vsx-mid{z-index:2;font-family:var(--display);font-weight:900;font-size:clamp(54px,11vw,120px);font-style:italic;color:#fff;
  text-shadow:0 0 24px var(--neon),0 0 60px rgba(164,107,255,.8),4px 4px 0 #000;animation:vsxV .6s .35s cubic-bezier(.2,1.6,.4,1) both;padding:0 6px}
.vsx-foot{grid-column:1/4;z-index:1;justify-self:center;width:min(520px,86vw);display:grid;gap:8px;justify-items:center;margin-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.vsx-ground{font-family:var(--display);font-weight:800;font-size:clamp(13px,2.4vw,18px);letter-spacing:.18em}
.vsx-ground::before{content:'⌖ ';color:var(--neon)}
.vsx-bar{width:100%;height:4px;border-radius:999px;background:rgba(160,200,230,.18);overflow:hidden}
.vsx-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#28e8ff,#a46bff);box-shadow:0 0 12px #28e8ff;animation:vsxBar var(--vt,2.8s) linear forwards}
.vsx-foot small{font-size:11px;letter-spacing:.3em;color:#8fa4bc}
@keyframes vsxL{from{transform:translateX(-60%);opacity:0}to{transform:none;opacity:1}}
@keyframes vsxR{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes vsxV{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes vsxBar{to{width:100%}}
@media (orientation:portrait){.vsx{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 1fr auto}.vsx-top,.vsx-foot{grid-column:1}.vsx-side img{height:min(26vh,70vw)}.vsx-mid{justify-self:center}
  .vsx::before{width:100%;height:55%;bottom:auto;left:0;clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}.vsx::after{width:100%;height:55%;top:auto;right:0;clip-path:polygon(0 20%,100% 0,100% 100%,0 100%)}}
@media (prefers-reduced-motion:reduce){.vsx *,.vsx::before,.vsx::after{animation-duration:.01s!important}}
/* first-match coach: one tip at a time, pointing at the control it teaches */
.coach{position:fixed;z-index:12;width:min(300px,calc(100vw - 24px));padding:12px 14px 10px;background:rgba(8,14,28,.92);border:1px solid var(--neon);border-radius:14px;
  box-shadow:0 0 0 1px rgba(60,240,255,.25),0 0 28px rgba(60,240,255,.35),0 14px 30px rgba(0,0,0,.5);color:var(--chalk);font-family:var(--body);pointer-events:none;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:coachIn .28s cubic-bezier(.2,1.4,.4,1)}
.coach[hidden]{display:none}
.coach .ck{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--neon);margin-bottom:4px}
.coach .ck i{font-style:normal;color:#8fa3bd;letter-spacing:.1em;margin-left:auto}
.coach b{display:block;font-family:var(--display);font-size:17px;font-weight:900;letter-spacing:.06em;color:var(--flare);text-shadow:0 0 14px rgba(255,210,74,.45);margin-bottom:2px}
.coach p{margin:0;font-size:15px;line-height:1.3;font-weight:600;color:#d7e4f2}
.coach .skip{pointer-events:auto;margin-top:8px;background:none;border:0;padding:4px 0;color:#8fa3bd;font-family:var(--display);font-size:10px;letter-spacing:.18em;cursor:pointer}
.coach::after{content:'';position:absolute;left:var(--ax,50%);width:14px;height:14px;background:rgba(8,14,28,.92);border:1px solid var(--neon);transform:translateX(-50%) rotate(45deg)}
.coach.dn::after{bottom:-8px;border-top:0;border-left:0}.coach.up::after{top:-8px;border-bottom:0;border-right:0}.coach.mid::after{display:none}
@keyframes coachIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
.coach-hi{animation:coachHi 1.1s ease-in-out infinite!important}
@keyframes coachHi{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,.9),0 0 18px rgba(255,210,74,.6)}60%{box-shadow:0 0 0 14px rgba(255,210,74,0),0 0 26px rgba(255,210,74,.2)}}
.touch .base.coach-hi{border-color:var(--flare)}
/* settings links and the after-match rate strip */
.links{display:grid;gap:8px;margin-top:4px}
.lnk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:rgba(12,20,40,.6);border:1px solid var(--line);border-radius:12px;color:var(--chalk);
  font-family:var(--display);font-size:12px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.lnk span{width:22px;text-align:center;font-size:17px}
.lnk.star{border-color:var(--flare);color:var(--flare);box-shadow:0 0 14px rgba(255,210,74,.18)}
.foot{text-align:center;color:#7f93ad;font-size:12px;margin-top:4px}
.ratebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--flare);border-radius:12px;background:rgba(255,210,74,.08)}
.ratebox span{flex:1 1 140px;font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--flare)}
.ratebox button{font-family:var(--display);font-size:11px;letter-spacing:.08em;padding:8px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--flare)}
.ratebox .yes{background:var(--flare);color:#1a1200;font-weight:900}.ratebox .no{background:none;color:#cbbf95;border-color:rgba(255,210,74,.35)}
@media (prefers-reduced-motion:reduce){.coach,.coach-hi{animation:none!important}}

let AC=null,master=null,crowdGain=null,muted=false,nbuf=null;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  // a limiter on the way out so stacked effects never clip (clipping was the crackle/static)
  const lim=AC.createDynamicsCompressor();lim.threshold.value=-10;lim.knee.value=6;lim.ratio.value=12;lim.attack.value=0.003;lim.release.value=0.2;lim.connect(AC.destination);
  master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(lim);
  nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  const bb=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),bd=bb.getChannelData(0);let lp=0;for(let i=0;i<bd.length;i++){lp=(lp+0.02*(Math.random()*2-1))/1.02;bd[i]=lp*3.5;}
  for(let i=0,n=AC.sampleRate*0.25;i<n;i++){const u=i/n,j=bd.length-n+i;bd[j]=bd[j]*(1-u)+bd[i]*u;}  /* seamless loop */
  musicGain=AC.createGain();musicGain.gain.value=musicOn?MUSIC_VOL:0;musicGain.connect(master);setInterval(musicTick,40);
  // crowd: a steady murmur only while a match is on (silent in the menus), plus swells for chances and goals
  const src=AC.createBufferSource();src.buffer=bb;src.loop=true;const lpf=AC.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=650;
  CROWD.amb=AC.createGain();CROWD.amb.gain.value=0;src.connect(lpf);lpf.connect(CROWD.amb);CROWD.amb.connect(master);src.start();
  const src2=AC.createBufferSource();src2.buffer=bb;src2.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=0.7;
  crowdGain=AC.createGain();crowdGain.gain.value=0;src2.connect(bp);bp.connect(crowdGain);crowdGain.connect(master);src2.start(0,1.7);
}
function tone(type,f0,f1,dur,vol,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,ftype,freq,delay=0){const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=ftype;f.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.02);}
function sfx(k){if(typeof ball!=='undefined'&&ball&&ball.holdT>0&&(k==='kick'||k==='bigkick')){ball.holdSfx=k;return;}netEv('s',k);
  if(!AC||muted)return;
  switch(k){
    case 'kick':tone('sine',180,55,0.09,0.6);noise(0.04,0.25,'lowpass',1800);break;
    case 'bigkick':tone('sine',140,40,0.18,0.9);noise(0.25,0.5,'lowpass',900);break;
    case 'tap':tone('sine',240,120,0.05,0.25);break;
    case 'thud':noise(0.22,1,'lowpass',380);tone('sine',90,35,0.2,0.8);break;
    case 'slide':noise(0.3,0.25,'bandpass',2200);break;
    case 'whoosh':noise(0.28,0.3,'bandpass',700);noise(0.2,0.18,'bandpass',1600,0.06);break;
    case 'crack':noise(0.09,0.9,'highpass',2400);tone('square',160,50,0.12,0.35);break;
    case 'note':{const f=[523,659,784,880][Math.random()*4|0];tone('triangle',f,f,0.18,0.14);};break;
    case 'land':noise(0.14,0.45,'lowpass',500);break;
    case 'post':tone('triangle',1250,1180,0.5,0.35);tone('sine',870,860,0.6,0.3);break;
    case 'whistle':[0,0.32].forEach(dl=>{tone('sine',2900,2850,0.24,0.22,dl);tone('square',2950,2900,0.24,0.04,dl);});break;
    case 'long':[0,0.45,0.9].forEach(dl=>tone('sine',2900,2850,dl===0.9?0.8:0.3,0.22,dl));break;
    case 'roar':{const t=AC.currentTime;crowdGain.gain.cancelScheduledValues(t);crowdGain.gain.setValueAtTime(crowdGain.gain.value,t);
      crowdGain.gain.linearRampToValueAtTime(0.42,t+0.35);crowdGain.gain.linearRampToValueAtTime(0,t+3.4);break;}
    case 'ooh':{const t=AC.currentTime;crowdGain.gain.cancelScheduledValues(t);crowdGain.gain.setValueAtTime(crowdGain.gain.value,t);
      crowdGain.gain.linearRampToValueAtTime(0.2,t+0.2);crowdGain.gain.linearRampToValueAtTime(0,t+1.4);break;}
  }
}

// Recorded crowd (crowd/crowd.json): a looping murmur under everything, chants every so often, a big cheer for goals.
const CROWD={buf:{},next:14,want:null,last:null,bed:null};
function crowdLoad(){if(!AC||CROWD.loading||location.protocol==='file:')return;CROWD.loading=true;
  const ld=f=>fetch('crowd/'+f).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)));
  fetch('crowd/crowd.json').then(r=>r.ok?r.json():null).then(j=>{if(!j)return;
    ld(j.bed).then(b=>{CROWD.buf.bed=b;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const g=AC.createGain();g.gain.value=0.3;s.connect(g);g.connect(master);s.start();CROWD.bed=g;}).catch(()=>{});
    ld(j.goal).then(b=>CROWD.buf.goal=b).catch(()=>{});
    for(const f of j.chants)ld(f).then(b=>{CROWD.buf[f.replace('.mp3','')]=b;}).catch(()=>{});}).catch(()=>{});}
function crowdPlay(name,vol){const b=CROWD.buf[name];if(!AC||!b)return;const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start();}
function crowdTick(dt){if(!AC||!CROWD.amb)return;
  const live=(state==='play'||state==='dead'||state==='goal'||state==='replay')&&!paused&&overlay.hidden,near=1-Math.min(Math.abs(ball.x),Math.abs(ball.x-W))/(W/2);
  CROWD.amb.gain.setTargetAtTime(live?(muted?0:0.16+near*0.1):0,AC.currentTime,live?0.6:0.15);
  return;
  // the murmur swells as the ball gets near either goal
  if(CROWD.bed){const near=1-Math.min(Math.abs(ball.x-0),Math.abs(ball.x-W))/(W/2);CROWD.bed.gain.value+=((state==='play'?0.24+near*0.3:0.3)-CROWD.bed.gain.value)*Math.min(1,dt*2);}
  if((CROWD.next-=dt)>0||(state!=='play'&&state!=='dead'&&state!=='goal'))return;
  let n=CROWD.want;CROWD.want=null;
  if(!n){const L=['chant_here','chant_studs','chant_ole','chant_who'].filter(k=>k!==CROWD.last&&CROWD.buf[k]);n=L[Math.random()*L.length|0];}
  if(n&&CROWD.buf[n]){crowdPlay(n,0.6);CROWD.last=n;}CROWD.next=16+Math.random()*16;}

// The host's phone runs the match: its player is team 0, the friend steers team 1. The friend's phone only sends its pad
// and draws what the host sends, turned round 180° so the friend also attacks left to right as team 0.
// Rooms go through PeerJS (lib/peerjs.min.js, free public signalling); add ?nettest to the URL to link two tabs with no network.
const NET={on:false,host:false,guest:false,peer:null,conn:null,code:'',saved:null,club:0,acc:0,lastIn:'',inT:0,seen:{},snap:null,snapAt:0,again:false,bc:null};

function netStatus(t){const e=document.getElementById('netStatus');if(e)e.textContent=t;}
function netLoad(){return new Promise((ok,no)=>{if(window.Peer||TEST)return ok();const sc=document.createElement('script');sc.src='lib/peerjs.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);});}
// A link that behaves like a PeerJS connection: tests use a BroadcastChannel between two tabs.
function testLink(code,isHost){const bc=new BroadcastChannel('studs-'+code),me=isHost?'h':'g',L={h:{},open:false,
  on(ev,f){L.h[ev]=f;return L;},send(o){bc.postMessage({from:me,o});},close(){bc.postMessage({from:me,bye:1});bc.close();if(L.h.close)L.h.close();}};
  bc.onmessage=e=>{const d=e.data;if(d.from===me)return;if(d.bye){if(L.h.close)L.h.close();return;}
    if(d.knock&&isHost){bc.postMessage({from:me,welcome:1});if(!L.open){L.open=true;if(NET.onConn)NET.onConn(L);}return;}
    if(d.welcome&&!isHost&&!L.open){L.open=true;if(L.h.open)L.h.open();return;}
    if(d.o&&L.h.data)L.h.data(d.o);};
  if(!isHost)bc.postMessage({from:me,knock:1});NET.bc=bc;return L;}
async function netHost(){netLeave();netStatus('Making a room…');
  try{await netLoad();}catch(e){netStatus('Could not load online play. Check your connection.');return;}
  const tryCode=()=>{const code=mkCode();NET.code=code;
    NET.onConn=c=>{if(NET.conn){try{c.close();}catch(e){}return;}netBind(c,true);};
    if(TEST){testLink(code,true);showRoom(code);return;}
    const peer=new Peer(ROOM+code);NET.peer=peer;
    peer.on('open',()=>showRoom(code));
    peer.on('connection',c=>NET.onConn(c));
    peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();tryCode();}else if(!NET.on)netStatus('Online play is not working right now ('+e.type+'). Try again in a minute.');});};
  tryCode();}

  '<p class="intro">Tell your friend to open Studs Up, tap 1V1 ONLINE and type this code. The match starts as soon as they join.</p>'+
