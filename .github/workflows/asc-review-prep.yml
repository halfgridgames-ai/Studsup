# One-off App Store helpers for the three iOS apps. Runs only when this branch is pushed.
# It never submits anything for review.
name: App Store review prep
on:
  push:
    branches: [asc-review-prep]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Add the studio Apple ID as a TestFlight tester
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTER_EMAIL: halfgridgames@gmail.com
        run: python3 .github/asc-review/asc_tester.py
