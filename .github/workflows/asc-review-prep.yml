# One-off App Store helpers for the three iOS apps. Runs only when this branch is pushed.
# It submits for review only when Boss has asked for that release.
name: App Store review prep
on:
  push:
    branches: [asc-review-prep]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Marble Mayhem 1.0.16
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STEP: status   # read-only; 1.0.16 was submitted 22 Nov
        run: python3 .github/asc-review/asc_mm116.py
      - name: Knot Wizard 1.1.5
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STEP: submit   # Boss: "Send it" 27 Nov 09:32
        run: python3 .github/asc-review/asc_kw115.py
      - name: Studs Up 0.6.3
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STEP: status
        run: python3 .github/asc-review/asc_su063.py
