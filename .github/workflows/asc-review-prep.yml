# One-off App Store helpers for the three iOS apps. Runs only when this branch is pushed.
# It submits for review only when Boss has asked for that release.
name: App Store review prep
on:
  push:
    branches: [asc-review-prep]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Marble Mayhem 1.0.16
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STEP: submit
        run: python3 .github/asc-review/asc_mm116.py
