# One-off App Store helpers for the three iOS apps. Runs only when this branch is pushed.
# It never submits anything for review.
name: App Store review prep
on:
  push:
    branches: [asc-review-prep]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Studs Up 0.5.7 beta status (read-only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SEND_FOR_BETA_REVIEW: "0"
        run: python3 .github/asc-review/asc_status.py
      - name: Check third review video (expected Knot Wizard) and attach only if it shows Knot Wizard
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg tesseract-ocr >/dev/null
          W=$RUNNER_TEMP/kw && mkdir -p $W
          curl -sSL -o $W/v.bin "https://drive.usercontent.google.com/download?id=1-jPgsZD-08dP4bUVASB9WQDY9CYbr1SZ&export=download&confirm=t"
          if file $W/v.bin | grep -qi -E "html|text"; then echo "::error::Drive returned a web page"; exit 1; fi
          bash .github/asc-review/video_check.sh $W/v.bin "KNOT WIZARD?" | tee $W/check.txt
          L=$(tr 'A-Z' 'a-z' < $W/check.txt)
          SU=$(echo "$L" | grep -o -E "studs|red card|kick|goal" | wc -l)
          KW=$(echo "$L" | grep -o -E "knot|wizard|hint" | wc -l)
          MM=$(echo "$L" | grep -o -E "marble|mayhem" | wc -l)
          echo "SU=$SU KW=$KW MM=$MM"
          if [ "$KW" -ge 3 ] && [ "$KW" -gt $((SU*2)) ] && [ "$KW" -gt $((MM*2)) ]; then
            mkdir -p .github/asc-review/videos
            if file $W/v.bin | grep -qi quicktime; then E=mov; else E=mp4; fi
            mv $W/v.bin .github/asc-review/videos/com.halfgridgames.knotwizard.$E
            python3 .github/asc-review/asc_attach.py
          else echo "::error::Not clearly Knot Wizard, not attached"; exit 1; fi
