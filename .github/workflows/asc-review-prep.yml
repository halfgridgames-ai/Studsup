# One-off App Store helpers for the three iOS apps. Runs only when this branch is pushed.
# It never submits anything for review.
name: App Store review prep
on:
  push:
    branches: [asc-review-prep]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Studs Up 0.5.7 beta status (read-only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SEND_FOR_BETA_REVIEW: "0"
        run: python3 .github/asc-review/asc_status.py
      - name: Content check of both attached review videos (read-only, no upload)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg tesseract-ocr >/dev/null
          W=$RUNNER_TEMP/vid && mkdir -p $W
          curl -sSL -o $W/mm.bin "https://drive.usercontent.google.com/download?id=1zWy3XYX0JJhX2ugbJOjVNv8eRDj4wCEF&export=download&confirm=t"
          curl -sSL -o $W/su.bin "https://drive.usercontent.google.com/download?id=109kd8NwbuSbofs8aG7jDDN-m04EOhcFn&export=download&confirm=t"
          bash .github/asc-review/video_check.sh $W/mm.bin "MARBLE MAYHEM"
          bash .github/asc-review/video_check.sh $W/su.bin "STUDS UP"
