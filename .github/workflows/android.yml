name: Android build
on:
  push:
    branches: [app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx cap sync android
      - name: Build unsigned release AAB and APK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      # Unsigned outputs go to the "builds" branch; they are signed with the upload key outside GitHub.
      - name: Publish to builds branch
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/
          echo "${GITHUB_SHA}" > out/SOURCE_COMMIT
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Android build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
