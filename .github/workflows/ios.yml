# Builds the Studs Up iPhone app on a GitHub-hosted Mac, so no Mac of our own is needed.
#
# Without the App Store Connect secrets it only checks that the iPhone app compiles.
# With them it also signs the app (Xcode cloud signing, using the API key) and uploads it
# to App Store Connect, where it shows up in TestFlight a few minutes later.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID     App Store Connect API key id (10 characters)
#   ASC_ISSUER_ID  issuer id shown above the key list (a long id with dashes)
#   ASC_KEY_P8     the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
#   APPLE_TEAM_ID  the 10-character team id from the Apple Developer membership page
# The key needs the Admin role: cloud signing creates the distribution certificate.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Pull requests only check the build; pushes to main and manual runs also upload.
      HAS_ASC: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      # Every upload needs a higher build number than the last; the run number always grows.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install npm packages
        working-directory: android-app
        run: npm ci

      - name: Copy web game into the iOS project and install pods
        working-directory: android-app
        run: |
          command -v pod >/dev/null || sudo gem install cocoapods --no-document
          bash ./sync-web.sh ios

      - name: Archive (unsigned)
        working-directory: android-app/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudsUp.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/StudsUp.xcarchive/Products/Applications/App.app"

      - name: Write App Store Connect key
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" || { echo "::error::ASC_KEY_P8 does not look like a .p8 key"; exit 1; }

      - name: Sign and upload to App Store Connect
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudsUp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log"
          echo "::notice::Uploaded build $BUILD_NUMBER to App Store Connect. It appears in TestFlight once Apple finishes processing."

      - name: Remove App Store Connect key
        if: always() && env.HAS_ASC == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studsup-ios-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - name: Note when signing is skipped
        if: env.HAS_ASC != 'true'
        run: echo "::notice::App Store Connect secrets not set - checked that the iPhone app builds, nothing was uploaded. See android-app/README-ios.md."
